<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cockpit Purple Team">
  <title>Cockpit Purple Team — radar animé (écran de connexion, chargement)</title>
  <circle cx="32" cy="32" r="26" fill="rgba(139,92,246,.08)" stroke="#8B5CF6" stroke-width="3"/>
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#8B5CF6" stroke-width="1.4" opacity=".38"/>
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#8B5CF6" stroke-width="1.4" opacity=".3"/>
  <path d="M32 6 v52 M6 32 h52" stroke="#8B5CF6" stroke-width="1" opacity=".18"/>
  <g>
    <path d="M32 32 L32 6 A26 26 0 0 1 51.8 15.1 Z" fill="#8B5CF6" opacity=".28"/>
    <path d="M32 32 L51.8 15.1" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="5s" repeatCount="indefinite"/>
  </g>
  <circle cx="41.5" cy="19.5" r="5.5" fill="#8B5CF6" opacity=".25">
    <animate attributeName="opacity" values=".25;.08;.25" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="41.5" cy="19.5" r="3" fill="#C0A8FF">
    <animate attributeName="opacity" values="1;.35;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="21.5" cy="40" r="2.2" fill="#A78BFA" opacity=".55">
    <animate attributeName="opacity" values=".55;.15;.55" dur="5s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
